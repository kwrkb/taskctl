name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Convert data assets
        shell: pwsh
        run: .\build\Convert-DataToJson.ps1

      - name: Publish NativeAOT single exe
        shell: pwsh
        run: |
          # Take the version from the tag so the binary can never disagree with the
          # release it ships in (the csproj default is only for local builds).
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish src/Taskctl.Cli -c Release -o build/publish -p:Version=$version

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "build/taskctl-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path build/publish/taskctl.exe -DestinationPath $zip -Force
          "ASSET=$zip" | Add-Content $env:GITHUB_ENV

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent so the Scoop steps below stay retryable: if publishing the
          # manifest fails, re-running the workflow for the same tag must not die
          # here with "release already exists".
          $prev = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $env:GITHUB_REF_NAME 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prev
          if ($exists) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; updating asset."
            gh release upload $env:GITHUB_REF_NAME $env:ASSET --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $env:ASSET --title $env:GITHUB_REF_NAME --generate-notes
          }

      - name: Load Scoop bucket token
        if: ${{ !contains(github.ref_name, '-') }}
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCOOP_GITHUB_TOKEN: op://gh/SCOOP_GITHUB_TOKEN/credential

      - name: Compute Scoop manifest hash/version
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLower()
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "HASH=$hash" | Add-Content $env:GITHUB_ENV
          "VERSION=$version" | Add-Content $env:GITHUB_ENV

      - name: Generate Scoop manifest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          # autoupdate.architecture.64bit.url must keep a LITERAL $version for Scoop's own
          # template syntax, so it's built with single quotes to suppress PowerShell expansion.
          $manifest = [ordered]@{
            version      = $env:VERSION
            description  = 'A diagnostic tool for Windows Task Scheduler that pinpoints why a task failed (or is likely to fail) and tells you what to do next.'
            homepage     = 'https://github.com/kwrkb/taskctl'
            license      = 'MIT'
            architecture = [ordered]@{
              '64bit' = [ordered]@{
                url  = "https://github.com/kwrkb/taskctl/releases/download/$env:GITHUB_REF_NAME/taskctl-$env:GITHUB_REF_NAME-win-x64.zip"
                bin  = 'taskctl.exe'
                hash = $env:HASH
              }
            }
            checkver   = [ordered]@{ github = 'https://github.com/kwrkb/taskctl' }
            autoupdate = [ordered]@{
              architecture = [ordered]@{
                '64bit' = [ordered]@{
                  url = 'https://github.com/kwrkb/taskctl/releases/download/v$version/taskctl-v$version-win-x64.zip'
                }
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path taskctl.json -Encoding utf8

      - name: Publish manifest to scoop-bucket
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          git clone "https://x-access-token:$env:SCOOP_GITHUB_TOKEN@github.com/kwrkb/scoop-bucket.git" bucket-repo
          # manifest は bucket/ の下に置く。scoop の `bucket list` は <repo>\bucket 配下しか
          # 数えず（lib/buckets.ps1）、Find-BucketDirectory も bucket/ があればそこだけを見る。
          # リポジトリ直下に書くと scoop から完全に無視される。
          New-Item -ItemType Directory -Force -Path bucket-repo/bucket | Out-Null
          Copy-Item taskctl.json bucket-repo/bucket/taskctl.json -Force
          Set-Location bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/taskctl.json
          # `if (<native cmd>)` tests stdout, not the exit code, so --quiet would always
          # take the else branch and fail on re-tag with "nothing to commit".
          if (git status --porcelain) {
            git commit -m "taskctl: update to $env:GITHUB_REF_NAME"
            git push
          } else {
            Write-Host "No manifest changes; skipping commit."
          }
